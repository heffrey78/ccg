name: Desktop

# The desktop app (#31) on Linux and Windows. It is slow, so it runs only when
# something it builds from changes, and on demand.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/web/**', 'packages/**', 'games/**', 'examples/**', 'pnpm-lock.yaml', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'apps/web/src/platform/**', 'pnpm-lock.yaml', '.github/workflows/desktop.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ccg/desktop test:rust
      - run: pnpm --filter @ccg/desktop build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: ccg-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
