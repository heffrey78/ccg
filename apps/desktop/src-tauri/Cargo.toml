[package]
name = "ccg-desktop"
version = "0.0.0"
description = "CCG engine app: desktop and Android (#157)"
edition = "2021"
publish = false

[lib]
name = "ccg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
